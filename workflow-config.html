<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>PingCode · 工作流配置</title>
<style>
:root{
  --primary:#6698ff; --success:#73d897; --warning:#ffcd5d; --danger:#ff7575; --info:#5dcfff;
  --orange:#fd7e14; --purple:#6f42c1;
  --g10:#fff; --g70:#f7f7f7; --g80:#fafafa; --g100:#f5f5f5; --g200:#eee;
  --g300:#ddd; --g400:#cacaca; --g500:#aaa; --g600:#999; --g700:#666; --g800:#333;
  --r:.25rem;
  --sd-menu:0 0 16px #00000014;
  --sd-drawer:-6px 0 18px rgba(0,0,0,.10);
  --fm:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Helvetica Neue","Noto Sans","Noto Sans CJK SC","Microsoft Yahei",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:var(--fm);font-size:14px;color:var(--g800);background:var(--g70);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit;cursor:pointer}
.mono{font-family:"SFMono-Regular",Menlo,Monaco,monospace;font-size:12px}

/* 按钮 */
.btn{display:inline-block;font-weight:400;text-align:center;white-space:nowrap;border:1px solid transparent;border-radius:var(--r);cursor:pointer;transition:all .15s ease-in-out}
.btn:focus{outline:0}
.btn-lg{padding:.375rem 1.25rem;font-size:.875rem;line-height:1.5715;min-width:97px}
.btn-sm{padding:.125rem 15px;font-size:.875rem;line-height:1.5715;min-width:70px}
.btn-xs{padding:.125rem 15px;font-size:.75rem;line-height:1.5;min-width:60px}
.btn-primary{color:#fff;background-color:var(--primary);border-color:var(--primary)}
.btn-primary:hover{box-shadow:0 2px 5px 1px #6698ff99}
.btn-default{color:var(--g700);background-color:var(--g200);border-color:var(--g200)}
.btn-default:hover{color:var(--g800);background-color:var(--g300);border-color:var(--g300)}
.btn-text{color:var(--g700);background:transparent}
.btn-text:hover{color:var(--primary)}
.btn-danger{color:var(--danger);background:transparent;border-color:transparent}
.btn-danger:hover{background:rgba(255,117,117,.12)}
.btn[disabled]{color:var(--g400);background-color:var(--g100);border-color:var(--g100);pointer-events:none}

/* 表单 */
.form-control{display:block;width:100%;color:var(--g800);background:#fff;border:1px solid var(--g200);border-radius:var(--r);font-family:inherit;font-size:13px;padding:5px 8px;height:30px;transition:border-color .15s}
.form-control:focus{border-color:var(--primary);outline:0}
textarea.form-control{height:auto;min-height:64px;line-height:1.7;resize:vertical}
.ck{accent-color:var(--primary);cursor:pointer}
.ckrow{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--g700);cursor:pointer;white-space:nowrap}

/* 标签 */
.tag{display:inline-flex;align-items:center;font-size:.75rem;border-radius:var(--r);border:1px solid transparent;padding:0 8px;height:20px;line-height:20px;white-space:nowrap}
.tag-pill{border-radius:18px;padding:0 12px;height:24px}
.tag-blue{color:#4a7fe0;background:rgba(102,152,255,.12);border-color:rgba(102,152,255,.4)}
.tag-green{color:#2c9e63;background:rgba(115,216,151,.18);border-color:rgba(115,216,151,.55)}
.tag-orange{color:#c26a10;background:rgba(255,205,93,.22);border-color:rgba(255,205,93,.75)}
.tag-red{color:#d04545;background:rgba(255,117,117,.14);border-color:rgba(255,117,117,.5)}
.tag-grey{color:var(--g600);background:var(--g100);border-color:var(--g200)}
.tag-purple{color:var(--purple);background:rgba(111,66,193,.1);border-color:rgba(111,66,193,.35)}
.tag-count{display:inline-block;color:var(--g600);background:var(--g200);border-radius:1rem;font-size:.75rem;padding:0 6px;line-height:16px;min-width:16px;text-align:center}

/* 被 index.html 内嵌时只保留主区 */
html.embed .rail, html.embed .pside, html.embed .pnav2{display:none}
html.embed .pc{background:#fff}
html.embed .typebar{padding-top:16px}

/* 被 index.html 内嵌时只保留主区 */
html.embed .rail, html.embed .pside, html.embed .pnav2{display:none}
html.embed .pc{background:#fff}
html.embed .typebar{padding-top:16px}

/* 外壳 */
.pc{display:flex;height:100vh;overflow:hidden;background:#fff}
.rail{width:200px;flex:none;background:#2b2f36;color:var(--g300);display:flex;flex-direction:column;overflow:hidden;transition:width .18s ease}
.rail.mini{width:60px}
.rail-logo{height:48px;display:flex;align-items:center;gap:10px;padding:0 14px;flex:none;color:#fff;cursor:pointer}
.rail-logo .mk{width:22px;height:22px;flex:none;border-radius:5px;background:var(--primary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600}
.rail-logo .brand{font-size:14px;font-weight:500;letter-spacing:.2px;white-space:nowrap}
.rail-logo .fold{margin-left:auto;color:#8b9096;display:flex;align-items:center;padding:4px;border-radius:3px}
.rail-logo:hover .fold{color:#fff}
.rail-logo .fold:hover{background:rgba(255,255,255,.1)}
.rail-scroll{flex:1;overflow:auto;padding:6px 0}
.rail a{display:flex;align-items:center;gap:10px;padding:0 14px 0 13px;height:38px;color:#b6bbc1;font-size:13.5px;cursor:pointer;white-space:nowrap;border-left:3px solid transparent}
.rail a:hover{background:rgba(255,255,255,.06);color:#fff}
.rail a.on{background:#3a3f48;color:#fff;border-left-color:var(--primary)}
.rail a .ic{flex:none;width:16px;display:flex;justify-content:center}
.rail-cap{font-size:11px;color:#7d838a;padding:14px 16px 6px;letter-spacing:.5px;white-space:nowrap}
.rail-foot{flex:none;border-top:1px solid #3d424a;padding:6px 0}
/* 收起态：只留图标 */
.rail.mini .rail-logo{padding:0;justify-content:center}
.rail.mini .rail-logo .brand,.rail.mini .rail-logo .fold,.rail.mini .rail a .tx{display:none}
.rail.mini .rail-scroll{padding:4px 0}
.rail.mini .rail a{justify-content:center;padding:0;border-left:none}
.rail.mini .rail-cap{font-size:0;height:1px;padding:0;margin:9px 12px;background:#3d424a}
.pc-body{flex:1;min-width:0;display:flex}
.pside{width:200px;flex:none;background:#fff;border-right:1px solid var(--g200);padding:14px 0;overflow:auto}
.pside-t{font-size:14px;font-weight:500;padding:0 18px 10px}
.pside .grp{font-size:11px;color:var(--g600);padding:10px 18px 6px}
.pside a{display:flex;align-items:center;gap:7px;padding:8px 18px;font-size:13.5px;color:var(--g700);cursor:pointer}
.pside a:hover{background:var(--g100)}
.pside a.on{color:var(--primary);font-weight:500;background:rgba(102,152,255,.08)}
.pside a.dim{color:var(--g500)}
.nx-tag{margin-left:auto;font-size:10.5px;line-height:16px;color:var(--purple);background:rgba(111,66,193,.1);border:1px solid rgba(111,66,193,.4);border-radius:2px;padding:0 5px}

.pmain{flex:1;min-width:0;display:flex;flex-direction:column;background:#fff}
.pnav2{display:flex;align-items:center;height:48px;flex:none;border-bottom:1px solid var(--g200);background:#fff;padding:0 20px;gap:2px;flex:none}
.pnav2 a{height:48px;padding:0 13px;display:flex;align-items:center;font-size:13.5px;color:var(--g700);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.pnav2 a.on{color:var(--primary);font-weight:500;border-bottom-color:var(--primary)}
.ptools{height:42px;flex:none;display:flex;align-items:center;gap:10px;padding:0 20px;border-bottom:1px solid var(--g200)}
.tsearch{display:flex;align-items:center;gap:6px;height:28px;border:1px solid var(--g200);border-radius:var(--r);padding:0 8px;color:var(--g500);font-size:12.5px;min-width:200px}
.tbtn{display:flex;align-items:center;gap:5px;font-size:13px;color:var(--g700);padding:5px 8px;border:none;background:none;border-radius:var(--r);cursor:pointer}
.tbtn:hover{color:var(--primary)}
.tcount{margin-left:auto;font-size:12.5px;color:var(--g600)}
.scroll{flex:1;overflow:auto;min-height:0}
.pad{padding:16px 20px 28px}

/* 类型条 */
.typebar{display:flex;align-items:center;gap:14px;padding:14px 20px 0}
.typebar .t{font-size:17px;font-weight:600}
.switch{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--g700);cursor:pointer}
.switch .track{width:34px;height:18px;border-radius:9px;background:var(--g300);position:relative;transition:background .15s}
.switch .knob{position:absolute;width:14px;height:14px;border-radius:50%;background:#fff;top:2px;left:2px;transition:left .15s}
.switch.on .track{background:var(--primary)}
.switch.on .knob{left:18px}

/* 页签 */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--g200);padding:0 20px;margin-top:14px;flex:none}
.tabs button{border:none;background:none;padding:10px 2px;margin-right:22px;font-size:13.5px;color:var(--g700);border-bottom:2px solid transparent;cursor:pointer}
.tabs button.on{color:var(--primary);font-weight:500;border-bottom-color:var(--primary)}

/* 表格 */
.tbl{width:100%;border-collapse:collapse;table-layout:fixed}
.tbl th{text-align:left;font-weight:400;font-size:12.5px;color:var(--g600);padding:9px 10px;border-bottom:1px solid var(--g200);background:var(--g80)}
.tbl td{padding:11px 10px;border-bottom:1px solid var(--g70);font-size:13px;vertical-align:middle}
.tbl tbody tr{cursor:pointer}
.tbl tbody tr:hover td{background:var(--g80)}
.flowcell{display:inline-flex;align-items:center;gap:8px}
.flowcell .to{color:var(--g500)}
.slot{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;border:1px solid var(--g200);border-radius:2px;padding:1px 6px;background:#fff;color:var(--g600)}
.slot.on{color:#4a7fe0;background:rgba(102,152,255,.08);border-color:rgba(102,152,255,.4)}
.slot.act{color:#2c9e63;background:rgba(115,216,151,.12);border-color:rgba(115,216,151,.5)}

/* 抽屉 */
.mask{position:fixed;inset:0;background:rgba(51,51,51,.35);display:none;z-index:50}
.mask.on{display:block}
.drawer{position:fixed;top:0;right:0;bottom:0;width:820px;max-width:94vw;background:#fff;box-shadow:var(--sd-drawer);z-index:60;display:none;flex-direction:column}
.drawer.on{display:flex}
.dw-head{padding:16px 20px 14px;border-bottom:1px solid var(--g200);flex:none}
.dw-title{font-size:16px;font-weight:600;display:flex;align-items:center;gap:10px}
.dw-sub{font-size:12.5px;color:var(--g600);margin-top:6px}
.dw-x{margin-left:auto;width:26px;height:26px;border:none;background:none;color:var(--g500);font-size:20px;line-height:1;border-radius:var(--r);display:flex;align-items:center;justify-content:center;padding:0 0 2px}
.dw-x:hover{background:var(--g100);color:var(--g800)}
.dw-body{flex:1;overflow:auto;padding:16px 20px}
/* 流转路径条（对齐 ONES 步骤流程条） */
.step-bar{display:flex;align-items:center;padding:13px 20px;border-bottom:1px solid var(--g200);background:var(--g80);flex:none}
.step-bar .sn{flex:none;border:1px solid var(--g300);border-radius:14px;padding:3px 15px;font-size:13px;color:var(--g700);background:#fff;white-space:nowrap;line-height:20px}
.step-bar .sn.cur{border-color:var(--primary);color:var(--primary);background:rgba(102,152,255,.09);font-weight:500}
.step-bar .line{flex:1;height:1px;background:var(--g300);position:relative;margin:0 10px}
.step-bar .line i{position:absolute;left:50%;top:-9px;transform:translateX(-50%);background:var(--g80);padding:0 9px;font-size:12px;color:var(--g600);font-style:normal;white-space:nowrap}
/* 页签（对齐 ONES 步骤配置页签） */
.dw-tabs{display:flex;gap:26px;padding:0 20px;border-bottom:1px solid var(--g200);flex:none;background:#fff}
.dw-tabs button{border:none;background:none;padding:11px 0;font-size:13.5px;color:var(--g700);border-bottom:2px solid transparent;cursor:pointer;display:flex;align-items:center;gap:6px}
.dw-tabs button:hover{color:var(--g800)}
.dw-tabs button.on{color:var(--primary);font-weight:500;border-bottom-color:var(--primary)}
.dw-tabs .cnt{font-style:normal;font-size:11px;line-height:16px;min-width:16px;height:16px;padding:0 4px;border-radius:2px;background:var(--g200);color:var(--g700);text-align:center}
.dw-tabs button.on .cnt{background:rgba(102,152,255,.16);color:var(--primary)}
/* 提示条（对齐 ONES info 提示） */
.info-bar{background:#f2f7ff;border-left:3px solid var(--primary);border-radius:0 var(--r) var(--r) 0;padding:9px 12px;font-size:12.5px;color:#555;line-height:1.95;margin-bottom:16px}
.info-bar ol{margin:0;padding-left:17px}
.info-bar li{margin:0}
.info-bar a{color:var(--primary);text-decoration:none;margin-left:3px}
/* 页签内主操作按钮 */
.btn-add{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 16px;font-size:13px;color:#fff;background:var(--primary);border:1px solid var(--primary);border-radius:var(--r);cursor:pointer;margin-top:12px}
.btn-add:hover{box-shadow:0 2px 5px 1px #6698ff99}
.btn-sub{display:inline-flex;align-items:center;height:32px;padding:0 16px;font-size:13px;color:var(--g700);background:#fff;border:1px solid var(--g200);border-radius:var(--r);cursor:pointer;margin-top:12px}
.btn-sub:hover{color:var(--primary);border-color:var(--primary)}
/* 表单字段表格 */
.ftbl{border:1px solid var(--g200);border-radius:var(--r);overflow:hidden;margin-bottom:10px}
.ftbl-hd,.fld{display:grid;grid-template-columns:13px 100px 78px 54px 86px 86px 1fr 40px;gap:8px;align-items:center;padding:8px 10px}
.fld-cond{margin:0 10px 10px 20px;padding:0 12px 2px;background:#f7f9ff;border-left:3px solid rgba(102,152,255,.5);border-radius:0 4px 4px 0;border-bottom:1px solid var(--g70)}
.fc-sec{padding:3px 0 5px}
.fc-sec+.fc-sec{border-top:1px dashed #e6e9ef}
.fc-hd{display:flex;align-items:center;gap:8px;padding:5px 0 3px;min-width:0}
.fc-hd b{font-size:12.5px;color:var(--g800);flex:none}
.fc-sub{font-size:11.5px;color:var(--g500);flex:none}
.fc-sum{font-size:11.5px;color:var(--g600);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fc-tg{margin-left:auto;flex:none;border:none;background:none;color:var(--primary);font-size:11.5px;cursor:pointer;padding:2px 5px;border-radius:3px}
.fc-tg:hover{background:rgba(102,152,255,.12)}
.fc-bd{padding-top:2px}
.fc-read{font-size:11.5px;color:var(--g600);padding:7px 2px 2px;line-height:1.7}
.fld-cond .cond-block{border-color:rgba(102,152,255,.3)}
.fld-cond .cond-row{grid-template-columns:13px 104px 156px 90px 1fr 28px}
.fld-cond .cond-group-ft{padding:2px 8px 5px}
.fld-cond .form-control{min-width:0}
.sec-h{font-size:12.5px;color:var(--g700);font-weight:500;margin:18px 0 8px;display:flex;align-items:baseline;gap:8px}
.sec-h span{font-size:11.5px;color:var(--g500);font-weight:400}
.sec-h:first-child{margin-top:4px}
.grp-hd input[data-gn]{border-color:transparent;background:transparent;font-weight:600;color:var(--g800);padding-left:5px}
.grp-hd input[data-gn]:hover{border-color:var(--g200);background:#fff}
.grp-hd input[data-gn]:focus{border-color:var(--primary);background:#fff}
.ftbl-hd{font-size:12px;color:var(--g600);background:var(--g80);border-bottom:1px solid var(--g200)}
.fld{border-bottom:1px solid var(--g70);font-size:13px}
.fld:last-child{border-bottom:none}.cond-block{border:1px solid var(--g200);border-radius:var(--r);background:#fff}
.cond-item-body{padding:2px 0}
.cond-conn{display:flex;align-items:center;padding:1px 12px 1px 24px;position:relative}
.cond-conn:before{content:'';position:absolute;left:19px;top:0;bottom:0;border-left:1px dashed var(--g300)}
.csel{width:58px!important;height:24px;text-align:center;padding:0 2px;font-size:12px;color:var(--g700);background:var(--g80)}
.cond-group{border:1px solid var(--g300);border-radius:var(--r);background:#fff;margin:4px 12px}
.cond-group-hd{display:flex;align-items:center;gap:8px;padding:5px 10px;background:var(--g80);border-bottom:1px solid var(--g200);font-size:12px;color:var(--g600);border-radius:var(--r) var(--r) 0 0}
.cond-group-ft{display:flex;gap:2px;padding:2px 10px 5px}
.cond-none{padding:10px 12px;font-size:12px;color:var(--g500)}
.cond-summary{margin-top:10px;padding:9px 12px;background:var(--g80);border-radius:var(--r);font-size:12px;color:var(--g700);line-height:1.8}
.cond-summary b{color:var(--g800);margin-right:6px}
.cond-row{display:grid;grid-template-columns:13px 112px 168px 92px 1fr 28px;gap:8px;align-items:center;padding:7px 12px;border-bottom:1px solid var(--g70)}
.cond-row:last-child{border-bottom:none}
.cond-row .form-control{min-width:0}
.cond-na{font-size:12px;color:var(--g500)}

/* ---- 来源标签：内置不标，来自 Ping Runner 的带底色小字 ---- */
.src-chip{flex:none;font-size:10px;line-height:15px;padding:0 5px;border-radius:3px;background:rgba(111,66,193,.12);color:var(--purple);font-weight:500;white-space:nowrap}
/* ---- 自定义下拉：选项里可带来源标签（原生 select 放不了样式） ---- */
.dd-btn{display:flex;align-items:center;gap:5px;width:100%;min-width:0;height:30px;padding:0 7px;border:1px solid var(--g300);border-radius:var(--r);background:#fff;font-size:13px;color:var(--g800);text-align:left}
.dd-btn:hover{border-color:var(--primary)}
.dd-btn .dd-tx{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn .dd-cr{flex:none;color:var(--g500);font-size:9px;line-height:1}
.dd-pop{position:fixed;z-index:130;min-width:252px;max-height:330px;overflow:auto;background:#fff;border:1px solid var(--g200);border-radius:var(--r);box-shadow:0 8px 26px rgba(0,0,0,.15);padding:4px;display:none}
.dd-pop.on{display:block}
.dd-grp{padding:8px 8px 3px;font-size:11px;color:var(--g500);display:flex;align-items:center;gap:6px}
.dd-grp.line{height:1px;background:var(--g100);padding:0;margin:5px 0 3px}
.dd-it{display:flex;align-items:center;gap:8px;width:100%;padding:6px 8px;border:none;background:none;border-radius:3px;text-align:left;font-size:13px;color:var(--g800)}
.dd-it:hover{background:var(--g80)}
.dd-it.on{background:rgba(102,152,255,.10)}
.dd-it .dd-n{flex:1;min-width:0}
.dd-it .dd-n i{display:block;font-style:normal;font-size:11px;color:var(--g500);margin-top:1px;line-height:1.4}
/* Ping Runner 类条件的行内控件说明 */
.pr-note{font-size:11px;color:var(--g500);display:flex;align-items:center;gap:5px;min-width:0}
.pr-note code{font-family:"SFMono-Regular",Menlo,Monaco,monospace;font-size:11px;color:var(--purple);background:rgba(111,66,193,.07);padding:1px 4px;border-radius:2px}
/* Ping Runner 类型条件的行：控件数量不定，改用 flex 排，删除按钮靠右 */
.cond-row.pr-row{display:flex;gap:8px;align-items:center}
.cond-row.pr-row .dd-btn{width:auto;flex:none;max-width:210px}
.cond-row.pr-row .dd-btn .dd-tx{flex:none}
.cond-row.pr-row select.form-control{width:auto;min-width:140px;max-width:240px;flex:none}
.cond-row.pr-row input.form-control{flex:1;min-width:130px}
.cond-row.pr-row .pr-note{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cond-row.pr-row>button[data-idx]{flex:none;margin-left:auto}
/* 摘要里 Ping Runner 标签与文字的间距 */
.cond-summary .src-chip,.fc-read .src-chip,.fc-sum .src-chip{margin-right:5px;vertical-align:1px}

/* ---- 拖拽排序：悬停行才出现把手 ---- */
.drag-h{width:13px;flex:none;display:inline-flex;align-items:center;justify-content:center;height:20px;border-radius:2px;cursor:grab;opacity:0;transition:opacity .12s,background .12s;color:var(--g400)}
.drag-h::before{content:"";width:9px;height:13px;background-image:radial-gradient(circle,currentColor 1.1px,transparent 1.3px);background-size:4.5px 4.5px;background-position:0 1px}
.drag-h:hover{background:rgba(102,152,255,.14);color:var(--primary)}
.drag-h:active{cursor:grabbing}
.fld-cell:hover>.fld .drag-h,.cond-row:hover .drag-h,.act-card:hover .drag-h,.grp-hd:hover .drag-h{opacity:1}
.act-top .drag-h{margin-left:-5px}
.grp-hd .drag-h{margin-left:-4px}

.row-c{display:flex;align-items:center;gap:8px;margin-bottom:8px}

.act-cfg select.form-control{width:auto;min-width:200px}
.note{border-left:3px solid var(--primary);background:rgba(102,152,255,.07);padding:9px 12px;font-size:12.5px;color:var(--g700);line-height:1.8;border-radius:0 var(--r) var(--r) 0}

.slot.fm.on{color:var(--purple);background:rgba(111,66,193,.12);border-color:rgba(111,66,193,.45)}
.fmask{position:fixed;inset:0;background:rgba(51,51,51,.45);display:none;z-index:70}
.fmask.on{display:flex;align-items:center;justify-content:center}
.fbox{width:560px;max-width:92vw;max-height:84vh;background:#fff;border-radius:8px;box-shadow:0 12px 48px rgba(0,0,0,.18);display:flex;flex-direction:column;overflow:hidden}

.fbox .fb{padding:16px 18px;overflow:auto}

.spec-card{border:1px solid var(--g200);border-radius:var(--r);background:var(--g80);padding:10px 12px;margin-bottom:12px}

.spec-grid .lb{display:block;font-size:11.5px;color:var(--g600);margin-bottom:4px}
.grp-box{border:1px solid var(--g200);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.grp-hd{display:flex;align-items:center;gap:6px;padding:6px 10px;background:var(--g80);border-bottom:1px solid var(--g200)}

.fld .op{display:flex;gap:2px;justify-content:flex-end;align-items:center}
.fld .op .btn{min-width:24px;padding:2px 4px}
.cond-box{border:1px solid var(--g200);border-radius:var(--r);margin-bottom:10px;overflow:hidden}
.cond-hd{display:flex;align-items:center;gap:8px;padding:7px 10px;background:var(--g80);border-bottom:1px solid var(--g200);font-size:12.5px;color:var(--g700)}
.cond-row:last-child{border-bottom:none}
.fm-tabs{display:flex;gap:2px;border-bottom:1px solid var(--g200);padding:0 14px}
.fm-tabs button{border:none;background:none;padding:9px 2px;margin-right:18px;font-size:13.5px;color:var(--g700);border-bottom:2px solid transparent;cursor:pointer}

.fm-pane{display:none}
.fm-pane.on{display:block}
.empty{border:1px dashed var(--g300);border-radius:var(--r);padding:12px;text-align:center;color:var(--g600);font-size:12.5px;background:var(--g80)}

.canvas{position:relative;background:#fff;border:1px solid var(--g200);border-radius:var(--r);overflow:auto}
.cv-tip{position:absolute;right:16px;bottom:16px;font-size:11.5px;color:var(--g600);background:rgba(255,255,255,.95);border:1px solid var(--g200);border-radius:12px;padding:2px 9px;pointer-events:none;z-index:2}
.cv-inner{position:relative;padding:30px}
.node{position:absolute;width:132px;border:1px solid var(--g200);border-radius:var(--r);background:#fff;padding:8px 10px;text-align:center;cursor:pointer}
.node:hover{border-color:var(--primary);box-shadow:0 2px 8px rgba(102,152,255,.18)}
.node.sel{border-color:var(--primary);box-shadow:0 0 0 3px rgba(102,152,255,.16)}
.node .nm{font-size:12.5px;color:var(--g800);margin-bottom:5px}
.node.has{box-shadow:0 0 0 2px rgba(115,216,151,.5)}
.edge{position:absolute;height:1px;background:var(--g300);transform-origin:0 50%}
.edge .lbl{position:absolute;left:50%;top:-20px;font-size:11px;color:var(--g600);background:#fff;padding:0 5px;white-space:nowrap;transform-origin:50% 50%}
.edge .arw{position:absolute;right:-4px;top:-3.5px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);color:var(--g300)}
.edge.rl .arw{color:var(--primary)}
.edge.rl{background:var(--primary)}
.legend{display:flex;gap:16px;align-items:center;font-size:12px;color:var(--g600);padding:10px 20px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}

.toast{position:fixed;top:60px;left:50%;transform:translateX(-50%) translateY(-16px);background:#fff;border-radius:var(--r);box-shadow:0 2px 8px rgba(0,0,0,.26);padding:10px 16px;font-size:13px;display:flex;align-items:center;gap:9px;z-index:200;opacity:0;pointer-events:none;transition:.22s;border-left:3px solid var(--success);max-width:640px}
.toast.show{opacity:1;transform:translateX(-50%)}
.toast.info{border-left-color:var(--primary)}
</style>
</head>

function leafCount(g){ return (g.items || []).reduce(function(a, it){ return a + (it.t === 'g' ? leafCount(it) : 1); }, 0); }
function condOnN(f){ return f.condOn ? leafCount(f.condOn) : 0; }
function condN(f){ return f.conds ? leafCount(f.conds) : 0; }
function formN(f){ return (f.form && f.form.groups) ? f.form.groups.reduce(function(a, g){ return a + g.fields.length; }, 0) : 0; }
function hasRule(f){ return (condOnN(f) + condN(f) + f.acts.length) > 0; }

var GRAPH_POS = {
  '待处理':[26,40], '定位中':[246,40], '审核中':[466,40], '待验证':[686,40], '已验证':[906,40], '已关闭':[1126,40],
  '挂起':[246,164], '已解决':[686,164], '驳回':[466,164]
};
function renderGraph(){
  el('cnt').textContent = '状态 ' + STATES.length + ' 个 · 流转 ' + FLOWS.length + ' 条';
  var pos = GRAPH_POS;
  var inner = '<div class="cv-inner" style="width:1300px;height:290px">';
  FLOWS.forEach(function(f){
    var a = pos[f.from], b = pos[f.to];
    if(!a || !b) return;
    var x1 = a[0] + 136, y1 = a[1] + 28, x2 = b[0], y2 = b[1] + 28;
    var dx = x2 - x1, dy = y2 - y1;
    var len = Math.sqrt(dx*dx + dy*dy);
    var ang = Math.atan2(dy, dx) * 180 / Math.PI;
    var hr = hasRule(f);
    inner += '<div class="edge' + (hr ? ' rl' : '') + '" style="left:' + x1 + 'px;top:' + y1 + 'px;width:' + Math.max(10, len - 7) + 'px;transform:rotate(' + ang + 'deg)">'
      + '<span class="lbl" style="transform:translate(-50%,-50%) rotate(' + (-ang) + 'deg)">' + esc(f.n) + '</span>'
      + '<span class="arw"></span></div>';
  });
  STATES.forEach(function(s){
    var p = pos[s.n]; if(!p) return;
    var cnt = FLOWS.filter(f => f.to === s.n && hasRule(f)).length;
    inner += '<div class="node' + (cnt ? ' has' : '') + '" data-st="' + esc(s.n) + '" style="left:' + p[0] + 'px;top:' + p[1] + 'px">'
      + '<div class="nm">' + esc(s.n) + '</div>'
      + '<span class="tag tag-pill tag-sm ' + catColor(s.cat) + '">' + esc(s.cat) + '</span></div>';
  });
  inner += '</div>';
  el('body').innerHTML =
      '<div class="legend"><span><i style="background:var(--g300)"></i>无规则流转</span><span><i style="background:var(--primary)"></i>带规则流转</span><span><i style="background:var(--success)"></i>入向带规则的状态</span><span style="color:var(--g600)">点击状态可配置其入向流转</span></div>'
    + '<div style="padding:10px 20px 20px;position:relative"><div class="canvas" id="gcv">' + inner + '</div></div>';
  /* 流程图在窄容器里宽度会超出：给出可横向滚动的提示，避免看起来像被截断 */
  var cv = el('gcv');
  if(cv && cv.scrollWidth > cv.clientWidth + 4){
    var tip = document.createElement('div');
    tip.className = 'cv-tip';
    tip.textContent = '⇄ 左右拖动查看完整流程';
    cv.parentNode.appendChild(tip);
  }
  el('body').querySelectorAll('.node').forEach(function(n){
    n.addEventListener('click', function(){
      var nm = n.getAttribute('data-st');
      var ins = FLOWS.filter(f => f.to === nm);
      if(ins.length) openDrawer(ins[0].id);
      else toast('「' + nm + '」没有入向流转');
    });
  });
}

function draw(){
  var f = DRAFT;
  var nf = condN(f), nc0 = condOnN(f), nAll = formN(f);
  el('dwName').textContent = f.n;
  var hasCfg = (nAll + nf + nc0 + f.acts.length) > 0;
  el('dwBadge').className = 'tag tag-pill ' + (hasCfg ? 'tag-blue' : 'tag-grey');
  el('dwBadge').textContent = hasCfg
    ? ('条件 ' + nc0 + ' · 表单 ' + nAll + ' · 校验 ' + nf + ' · 动作 ' + f.acts.length)
    : '未配置';
  el('dwSub').textContent = '配置挂在这一条流转上，保存后立即对该工作项类型生效';

  /* 流转路径条 */
  el('dwStep').innerHTML = '<span class="sn">' + esc(f.from) + '</span>'
    + '<span class="line"><i>' + esc(f.n) + '</i></span>'
    + '<span class="sn cur">' + esc(f.to) + '</span>';

  /* 页签 */
  el('dwTabs').innerHTML = dwTabBtn('condOn', '流转条件', nc0)
    + dwTabBtn('form', '流转表单', nAll)
    + dwTabBtn('verify', '流转验证', nf)
    + dwTabBtn('post', '后置动作', f.acts.length);

  el('dwBody').innerHTML = DW_TAB === 'condOn' ? paneCond(f, 'condOn')
    : DW_TAB === 'form' ? paneForm(f)
    : DW_TAB === 'verify' ? paneCond(f, 'conds')
    : panePost(f);
  bind();

  var bits = [];
  if(nc0) bits.push('流转条件 ' + nc0 + ' 条');
  if(nAll) bits.push('表单 ' + nAll + ' 项');
  if(nf) bits.push('校验 ' + nf + ' 条');
  if(f.acts.length) bits.push('后置动作 ' + f.acts.length + ' 个');
  el('dwHint').innerHTML = bits.length ? '保存后对该类型的缺陷立即生效　·　' + bits.join(' · ') : '该流转未配置任何规则，等同于「所有人可流转、无附加动作」';
}

/* ---- 流转条件 / 流转验证：且或组合 + 层级嵌套（对应 Jira 条件分组） ---- */
function pstr(p){ return p.length ? p.join('-') : 'r'; }
function pparse(s){ return (s === 'r' || s === '') ? [] : s.split('-').map(Number); }
function condNodeAt(root, path){
  var n = root;
  for(var i = 0; i < path.length; i++){ n = n.items[path[i]]; }
  return n;
}
/* ================= 类型选择浮层（内置 / 来自 Ping Runner） =================
   原生 select 的 option 放不了带底色的小标签，所以这里用自定义浮层；
   分两组列出，Ping Runner 提供的项右侧带 src-chip。 */
var DD_CTX = null;
function ddGroups(kind){
  var list;
  if(kind === 'act'){
    list = ACT_ORDER.map(function(k){ return { k:k, n:ACTS[k].n, d:ACTS[k].d, src:ACTS[k].src }; });
  } else {
    list = ((kind === 'valid') ? VALID_ORDER : COND_ORDER).map(function(k){
      return { k:k, n:COND_KINDS[k].n, d:COND_KINDS[k].d, src:COND_KINDS[k].src };
    });
  }
  return [
    { n:(kind === 'act' ? '内置动作' : '内置条件'), items:list.filter(function(x){ return x.src === 'in'; }) },
    { n:'来自 Ping Runner', items:list.filter(function(x){ return x.src === 'pr'; }) }
  ];
}
function ddPopHTML(kind, cur){
  return ddGroups(kind).map(function(g, gi){
    if(!g.items.length) return '';
    return (gi ? '<div class="dd-grp line"></div>' : '')
      + '<div class="dd-grp">' + g.n + '</div>'
      + g.items.map(function(x){
          return '<button class="dd-it' + (x.k === cur ? ' on' : '') + '" data-dd-k="' + x.k + '">'
            + '<span class="dd-n">' + esc(x.n) + '<i>' + esc(x.d) + '</i></span>'
            + srcChip(x.src) + '</button>';
        }).join('');
  }).join('');
}
function openDD(btn, kind, cur, onPick){
  var pop = el('ddPop'); if(!pop) return;
  pop.innerHTML = ddPopHTML(kind, cur);
  pop.classList.add('on');
  var r = btn.getBoundingClientRect();
  var w = pop.offsetWidth, ph = pop.offsetHeight;
  var left = Math.max(8, Math.min(r.left, window.innerWidth - w - 12));
  var top  = r.bottom + 4;
  if(top + ph > window.innerHeight - 10) top = Math.max(8, r.top - ph - 4);
  pop.style.left = left + 'px';
  pop.style.top  = top + 'px';
  DD_CTX = { kind:kind, onPick:onPick };
}
function closeDD(){ var p = el('ddPop'); if(p) p.classList.remove('on'); DD_CTX = null; }

/* 新增条件的默认参数 */
function newCond(k){
  var it = { t:'c', kind:k };
  if(k === 'field')            { it.f = '严重程度'; it.op = 'in'; it.v = ''; }
  else if(k === 'system')      { it.f = '当前用户'; it.op = 'eq'; it.v = ''; }
  else if(k === 'linked')      { it.f = '子工作项全部完成'; it.op = 'eq'; it.v = ''; }
  else if(k === 'pscript')     { it.f = PR_SCRIPTS.cond[0][0]; }
  else if(k === 'pjql')        { it.v = 'project = XD AND status != Done AND assignee = currentUser()'; }
  else if(k === 'puattr')      { it.f = '当前用户所属部门'; it.op = 'eq'; it.v = ''; }
  else if(k === 'pvalid')      { it.f = PR_SCRIPTS.valid[0][0]; }
  else if(k === 'puniq')       { it.f = 'GerritID'; }
  else if(k === 'ppattern')    { it.f = 'GerritID'; it.v = '^I[0-9a-f]{8,40}$'; }
  return it;
}

  else if(k === 'pclone')     { a.f = '玄戒芯片研发项目'; a.v = '缺陷'; }

/* ---- 条件树渲染：连接词在行间，同层统一；组作为整体参与父层 ---- */
function condRowText(it){
  var kd = COND_KINDS[it.kind] || COND_KINDS.field;
  if(kd.src === 'pr'){
    var body;
    if(it.kind === 'pjql')           body = 'PQL「' + esc(it.v || '') + '」';
    else if(it.kind === 'ppattern')  body = esc(it.f || '') + ' 匹配 /' + esc(it.v || '') + '/';
    else if(it.kind === 'puniq')     body = esc(it.f || '') + ' 项目内唯一';
    else                             body = esc(it.f || kd.n);
    return '<span class="src-chip">Ping Runner</span> ' + body;
  }
  var opTxt = OP_TXT[it.op] || it.op;
  var needVal = ['empty','notempty'].indexOf(it.op) < 0;
  return esc(it.f) + ' ' + opTxt + (needVal && it.v ? ' 「' + esc(it.v) + '」' : '');
}
function condSummary(g){
  if(!g || !g.items || !g.items.length) return '';
  var conn = (g.conn || 'AND') === 'OR' ? ' 或 ' : ' 且 ';
  return g.items.map(function(it){
    return (it.t === 'g') ? '（' + condSummary(it) + '）' : condRowText(it);
  }).join(conn);
}
function condGroupHTML(g, path, depth, isRoot, scope){
  scope = scope || 'cond';
  var conn = g.conn || 'AND';
  var h = '';
  if(isRoot){
    h += '<div class="cond-block">';
  } else {
    h += '<div class="cond-group"><div class="cond-group-hd"><span>条件组</span>'
      + '<button class="btn btn-danger btn-xs" style="margin-left:auto" data-delg="' + pstr(path) + '">删除组</button></div>';
  }
  h += '<div class="cond-item-body">';
  g.items.forEach(function(it, i){
    if(i > 0){
      h += '<div class="cond-conn"><select class="form-control csel" data-conn="' + pstr(path) + '">'
        + '<option value="AND"' + (conn === 'AND' ? ' selected' : '') + '>且</option>'
        + '<option value="OR"' + (conn === 'OR' ? ' selected' : '') + '>或</option>'
        + '</select></div>';
    }
    var ip = path.concat([i]);
    h += (it.t === 'g') ? condGroupHTML(it, ip, depth + 1, false, scope) : condRowHTML(it, pstr(ip), scope);
  });
  if(!g.items.length) h += '<div class="cond-none">暂无条件 —— 添加一条，否则等价于不限制</div>';
  h += '</div>';
  h += '<div class="cond-group-ft">'
    +  '<button class="btn btn-text btn-xs" data-addc="' + pstr(path) + '" data-scope="' + scope + '">+ 条件</button>'
    +  (depth < 1 ? '<button class="btn btn-text btn-xs" data-addg="' + pstr(path) + '">+ 条件组</button>' : '')
    + '</div></div>';
  return h;
}

function fieldOf(f, gi, fi){ return f.form.groups[gi].fields[fi]; }

function moveField(f, gi, fi, d){
  var g = f.form.groups[gi], t = g.fields[fi];
  if(d < 0 && fi > 0){ g.fields[fi-1] = t; g.fields[fi] = g.fields[fi-1]; g.fields[fi-1] = t; }
  if(d > 0 && fi < g.fields.length-1){ g.fields[fi+1] = t; g.fields[fi] = g.fields[fi+1]; g.fields[fi+1] = t; }
}
function moveGroup(f, gi, d){
  var gs = f.form.groups, t = gs[gi];
  var j = gi + d;
  if(j < 0 || j >= gs.length) return;
  gs[gi] = gs[j]; gs[j] = t;
}

function bind(){
  var f = DRAFT;
  qsa('[data-dwtab]').forEach(function(b){ b.addEventListener('click', function(){ DW_TAB = b.getAttribute('data-dwtab'); draw(); }); });
  qsa('[data-fs]').forEach(function(i){ i.addEventListener('change', function(){ f.form[i.getAttribute('data-fs')] = i.value; draw(); }); });
  qsa('[data-gn]').forEach(function(i){ i.addEventListener('change', function(){ f.form.groups[+i.getAttribute('data-gn')].name = i.value; }); });
  qsa('[data-gu]').forEach(function(b){ b.addEventListener('click', function(){ moveGroup(f, +b.getAttribute('data-gu'), -1); draw(); }); });
  qsa('[data-gd]').forEach(function(b){ b.addEventListener('click', function(){ moveGroup(f, +b.getAttribute('data-gd'), 1); draw(); }); });

  var af = el('addField');

    var used = []; f.form.groups.forEach(function(x){ x.fields.forEach(function(y){ used.push(y.key); }); });
    var k = FIELDS.filter(function(x){ return used.indexOf(x) < 0; })[0];
    if(!k) return;
    g.fields.push({ key:k, ctl:'text', bind:true, req:true, ph:'', def:'' });
    draw();
  });
  qsa('[data-fi]').forEach(function(row){
    var gi = +row.getAttribute('data-fi'), fi = +row.getAttribute('data-fj');
    qsa('[data-fx]', row).forEach(function(i){

    });
  });

      var gi = +row.getAttribute('data-fi'), fi = +row.getAttribute('data-fj');
      var x = fieldOf(f, gi, fi), k = sel.getAttribute('data-fm'), v = sel.value;
      if(k === 'req'){
        x.req = v;
        if(v === 'cond' && !x.reqCond) x.reqCond = { conn:'AND', items:[{ t:'c', kind:'field', f:'严重程度', op:'eq', v:'致命' }] };
      } else {
        x.show = v;
        if(v === 'cond' && !x.showCond) x.showCond = { conn:'AND', items:[{ t:'c', kind:'field', f:'严重程度', op:'eq', v:'致命' }] };
      }
      if(v === 'cond') FC_OPEN[gi + '-' + fi + '-' + k] = true;   /* 刚切到条件态：默认展开 */
      draw();
    });
  });
  qsa('[data-fctg]').forEach(function(b){
    b.addEventListener('click', function(){

    });
  });
  qsa('[data-fx-del]').forEach(function(b){ b.addEventListener('click', function(){ var a = b.getAttribute('data-fx-del').split('-'); f.form.groups[+a[0]].fields.splice(+a[1], 1); draw(); }); });
  qsa('[data-fu]').forEach(function(b){ b.addEventListener('click', function(){ var a = b.getAttribute('data-fu').split('-'); moveField(f, +a[0], +a[1], -1); draw(); }); });
  qsa('[data-fd]').forEach(function(b){ b.addEventListener('click', function(){ var a = b.getAttribute('data-fd').split('-'); moveField(f, +a[0], +a[1], 1); draw(); }); });

  qsa('[data-cg]').forEach(function(box){
    var spec = box.getAttribute('data-cg');
    var root;
    if(spec.indexOf('f:') === 0){
      /* 字段级条件：f:<gi>-<fi>:<reqCond|showCond> */
      var seg = spec.split(':'), pp = seg[1].split('-');
      var fx = fieldOf(f, +pp[0], +pp[1]);
      if(!fx[seg[2]]) fx[seg[2]] = { conn:'AND', items:[] };
      root = fx[seg[2]];
    } else {
      root = f[spec];

    function node(p){ return condNodeAt(root, pparse(p)); }
    function parentOf(p){

      return { group: condNodeAt(root, a), idx: last };
    }
    qsa('[data-conn]', box).forEach(function(sel){
      sel.addEventListener('change', function(){
        var n = node(sel.getAttribute('data-conn'));
        n.conn = sel.value; delete n.logic; draw();
      });
    });
    qsa('[data-addc]', box).forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var g = node(b.getAttribute('data-addc'));

        openDD(b, sc, null, function(k){ g.items.push(newCond(k)); draw(); });
      });
    });
    qsa('[data-dd="kind"]', box).forEach(function(b){
      b.addEventListener('click', function(e){
        e.stopPropagation();
        var p = b.getAttribute('data-p');
        var sc = b.getAttribute('data-scope') || 'cond';
        openDD(b, sc, (node(p).kind || 'field'), function(k){
          var it = node(p);
          it.t = 'c'; it.kind = k;

          var n = newCond(k);

    });

    qsa('[data-delg]', box).forEach(function(b){

        par.group.items.splice(par.idx, 1); draw();
      });
    });
    qsa('[data-idx]', box).forEach(function(b){
      b.addEventListener('click', function(){
        var par = parentOf(b.getAttribute('data-idx'));
        par.group.items.splice(par.idx, 1); draw();
      });
    });
    qsa('[data-p]', box).forEach(function(row){
      var p = row.getAttribute('data-p');
      qsa('[data-ik]', row).forEach(function(i){
        i.addEventListener('change', function(){ node(p)[i.getAttribute('data-ik')] = i.value; draw(); });
      });
    });
  });
  qsa('[data-addc-init]').forEach(function(b){
    b.addEventListener('click', function(e){
      e.stopPropagation();
      var k = b.getAttribute('data-addc-init');
      var sc = b.getAttribute('data-scope') || 'cond';
      openDD(b, sc, null, function(kk){

  var aa = el('addAct');
  if(aa) aa.addEventListener('click', function(e){
    e.stopPropagation();
    openDD(aa, 'act', null, function(k){ f.acts.push(newAct(k)); draw(); });
  });
  qsa('[data-ai]').forEach(function(card){
    var i = +card.getAttribute('data-ai');
    qsa('[data-ak]', card).forEach(function(inp){

  qsa('[data-act-down]').forEach(function(b){ b.addEventListener('click', function(){ var i=+b.getAttribute('data-act-down'); var t=f.acts[i]; f.acts[i]=f.acts[i+1]; f.acts[i+1]=t; draw(); }); });
  var pf = el('previewForm');
  if(pf) pf.addEventListener('click', function(){ previewForm(f); });
  bindDrag();
}

/* ================= 拖拽排序：把手 hover 才出现，按住上下拖 ================= */
var DRAG = null;
function rootOfCg(spec){
  if(spec.indexOf('f:') === 0){
    var seg = spec.split(':'), pp = seg[1].split('-');
    var fx = fieldOf(DRAFT, +pp[0], +pp[1]);
    if(!fx[seg[2]]) fx[seg[2]] = { conn:'AND', items:[] };
    return fx[seg[2]];
  }
  return DRAFT[spec];
}
function kidsOf(parent, cls){
  return Array.prototype.filter.call(parent.children, function(x){ return x.classList && x.classList.contains(cls); });
}
function commitDrag(kind, parent){
  if(!parent || !DRAFT) return;
  var f = DRAFT, changed = false;
  if(kind === 'group'){
    var boxes = kidsOf(parent, 'grp-box');
    if(boxes.length > 1){
      var og = f.form.groups.slice();
      f.form.groups = boxes.map(function(b){ return og[+b.getAttribute('data-gi')]; }).filter(Boolean);
      changed = true;
    }
  } else if(kind === 'field'){
    var gi = +parent.getAttribute('data-gi');
    var cells = kidsOf(parent, 'fld-cell');
    if(cells.length > 1 && f.form.groups[gi]){
      var of = f.form.groups[gi].fields.slice();
      f.form.groups[gi].fields = cells.map(function(c){ return of[+c.getAttribute('data-fj')]; }).filter(Boolean);
      changed = true;
    }
  } else if(kind === 'act'){
    var cards = kidsOf(parent, 'act-card');
    if(cards.length > 1){
      var oa = f.acts.slice();
      f.acts = cards.map(function(c){ return oa[+c.getAttribute('data-ai')]; }).filter(Boolean);
      changed = true;
    }
  } else if(kind === 'cond'){
    var rows = kidsOf(parent, 'cond-row');
    if(rows.length > 1){
      var box = parent.closest('[data-cg]');
      if(box){
        var root = rootOfCg(box.getAttribute('data-cg'));
        var arr = rows[0].getAttribute('data-p').split('-'); arr.pop();
        var grp = condNodeAt(root, arr.map(Number));
        var oc = grp.items.slice();
        grp.items = rows.map(function(r){
          var pp = r.getAttribute('data-p').split('-');
          return oc[+pp[pp.length-1]];
        }).filter(Boolean);
        changed = true;
      }
    }
  }
  if(changed) draw();
}
function bindDrag(){
  qsa('.drag-h').forEach(function(h){
    h.addEventListener('mousedown', function(){
      var row = h.closest('[data-drag]');
      if(row) row.setAttribute('draggable', 'true');
    });
    h.addEventListener('click', function(e){ e.stopPropagation(); });
  });
  qsa('[data-drag]').forEach(function(row){
    /* 事件会从里层行冒泡到外层分组，必须确认事件归属的就是本层 */
    function mine(e){
      var n = e.target && e.target.closest ? e.target.closest('[data-drag]') : null;
      return n === row;
    }
    row.addEventListener('mouseup', function(){ if(!DRAG) row.removeAttribute('draggable'); });
    row.addEventListener('dragstart', function(e){
      if(!mine(e)) return;
      e.stopPropagation();
      DRAG = { el: row, parent: row.parentNode, kind: row.getAttribute('data-drag') };
      row.classList.add('dragging');
      try{ e.dataTransfer.effectAllowed = 'move'; e.dataTransfer.setData('text/plain', 'x'); }catch(_){}
    });
    row.addEventListener('dragover', function(e){
      if(!mine(e)) return;
      if(!DRAG || DRAG.el === row || DRAG.parent !== row.parentNode) return;
      /* 条件组里混有子组时不支持拖动，避免索引错位 */
      if(row.parentNode.querySelector('.cond-group')) return;
      e.preventDefault(); e.stopPropagation();
      var r = row.getBoundingClientRect();
      var after = (e.clientY - r.top) > r.height / 2;
      var ref = after ? row.nextElementSibling : row;
      row.parentNode.insertBefore(DRAG.el, ref);
    });
    row.addEventListener('drop', function(e){ if(mine(e)) e.preventDefault(); });
    row.addEventListener('dragend', function(e){
      if(!mine(e)) return;
      row.removeAttribute('draggable');
      row.classList.remove('dragging');
      if(DRAG){ commitDrag(DRAG.kind, DRAG.el.parentNode); DRAG = null; }
    });
  });
}

  this.querySelectorAll('button').forEach(x => x.classList.toggle('on', x === b));

  renderBody();
});

  var fmk = el('fmask');
  if(fmk && fmk.classList.contains('on')){ fmk.classList.remove('on'); return; }

});
